# Wednesday default configuration.
# Do not edit this file for personal tweaks: copy only the keys you want to change into
#   ~/.config/wednesday/config.yaml
# which is deep-merged on top of this file.

assistant:
  name: Wednesday
  # 0.0 = strictly professional, 1.0 = maximum deadpan. Affects canned quips and the prompt.
  humor: 0.7
  # Occasional unprompted one-liners in the avatar speech bubble (never uses the model).
  idle_quips: true
  idle_quip_minutes: 30

model:
  # Which profile below to load. Switch models by changing this one key.
  active: qwen35-2b-q4
  profiles:
    qwen35-2b-q4:
      file: Qwen3.5-2B-Q4_K_M.gguf
      sha256: aaf42c8b7c3cab2bf3d69c355048d4a0ee9973d48f16c731c0520ee914699223
      url: https://huggingface.co/unsloth/Qwen3.5-2B-GGUF/resolve/main/Qwen3.5-2B-Q4_K_M.gguf
      size_gb: 1.28
      # Qwen3.5 is a hybrid reasoning model: thinking can be toggled per request.
      supports_thinking: true
      # Sampling: Qwen's published recommendations for Qwen3.5 (top_k 20, presence penalty),
      # with the cooler 0.7/0.8 variant for chat — it won our A/B test on tone and focus.
      sampling:
        fast:  {temperature: 0.7, top_p: 0.8, top_k: 20, min_p: 0.0, presence_penalty: 1.5}
        think: {temperature: 1.0, top_p: 0.95, top_k: 20, min_p: 0.0, presence_penalty: 1.5}
    qwen35-2b-q8:
      file: Qwen3.5-2B-Q8_0.gguf
      sha256: 1b04acba824817554f4ce23639bc8495ff70453b8fcb047900c731521021f2c1
      url: https://huggingface.co/unsloth/Qwen3.5-2B-GGUF/resolve/main/Qwen3.5-2B-Q8_0.gguf
      size_gb: 2.01
      supports_thinking: true
      sampling:
        fast:  {temperature: 0.7, top_p: 0.8, top_k: 20, min_p: 0.0, presence_penalty: 1.5}
        think: {temperature: 1.0, top_p: 0.95, top_k: 20, min_p: 0.0, presence_penalty: 1.5}
  # llama.cpp build directory, relative to the data dir (~/.local/share/wednesday)
  runtime_dir: runtime/b11853/llama-b11853
  # "auto" = first NVIDIA Vulkan device, falling back to CPU. Or an explicit name like "Vulkan1" / "none".
  device: auto
  gpu_layers: 99
  ctx_size: 16384
  # CPU threads used for the parts that don't run on the GPU. The i5-13420H has 4 P-cores.
  threads: 4
  # Port of the private llama-server instance (always bound to 127.0.0.1).
  port: 18181
  # Load the model as soon as the backend starts so the first reply is instant.
  preload: true
  # Stop llama-server (frees all VRAM) after this many idle minutes. 0 = never.
  idle_unload_minutes: 20
  startup_timeout_s: 90
  request_timeout_s: 240
  max_tokens: 1536
  # auto = think only for questions that look like they need it; fast = never; deep = always
  thinking: auto
  # Max tokens the model may spend thinking before it is told to answer.
  reasoning_budget: 512
  max_tool_rounds: 6
  # auto = only offer tools when the request looks like it needs them (2B models over-use tools)
  tools: auto

server:
  host: 127.0.0.1
  port: 7377

memory:
  enabled: true
  # Save short summaries of conversations when the context is compressed (never raw transcripts).
  save_summaries: true
  retention_days: 365
  max_injected: 4

web:
  # The online/offline switch can also be flipped live from the panel.
  online: true
  # auto: DuckDuckGo, falling back to Wikipedia + DDG Instant Answers when DDG declines bots.
  # For full-quality web search set provider: brave (+ BRAVE_API_KEY in .env) or your own searxng.
  provider: auto              # auto | duckduckgo | searxng | brave
  searxng_url: ""             # e.g. http://127.0.0.1:8888 if you self-host SearXNG
  # Optional contact (email or URL) added to the User-Agent. Wikimedia's API policy expects one
  # and may refuse anonymous scripts. Off by default — Wednesday never adds it on her own.
  contact: ""
  timeout_s: 12
  max_results: 5
  max_page_chars: 2500

voice:
  enabled: true
  stt_model_dir: voices/whisper-base.en
  stt_threads: 4
  tts_voice: voices/en_GB-cori-high.onnx
  # Read replies aloud. Toggle from the panel; this is just the startup default.
  speak_replies: false
  max_record_seconds: 60
  input_device: ""            # PipeWire target name; empty = system default
  # Words the speech recogniser should expect (improves accuracy on jargon).
  vocabulary: "Wednesday, ROS 2, colcon, rclpy, Gazebo, Hyprland, Python, TypeScript, React, Arduino, git, CUDA, llama.cpp, Ubuntu, workspace, terminal"
  output_device: ""

resources:
  poll_idle_s: 15
  poll_active_s: 3
  # Refuse new inference if available system RAM drops below this.
  min_free_ram_mb: 1200
  # Refuse new inference when the GPU is within this many °C of the slowdown
  # temperature *reported by the NVIDIA driver* (nvidia-smi -q -d TEMPERATURE).
  gpu_temp_margin_c: 5
  # Same idea for the CPU package, relative to the coretemp "high" value from the kernel.
  cpu_temp_margin_c: 5
  max_queue: 4

avatar:
  scale: 1.0
  anchor: bottom-right
  margin_x: 24
  margin_y: 24
  fps_active: 30
  # Idle breathing is slow, so 5 fps is enough; blinks and eye movements burst to fps_active.
  fps_idle: 5
  fps_sleep: 3
  # Avatar dozes off (SLEEPING) after this many idle minutes.
  sleep_after_minutes: 8

logging:
  level: INFO
  # Never log full prompts or model replies unless you turn this on for debugging.
  log_content: false
