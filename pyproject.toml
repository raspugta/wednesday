[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wednesday"
version = "0.1.0"
description = "Wednesday — a local-first desktop AI companion for Linux/Hyprland"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.12,<4",
    "pyyaml>=6,<7",
    "psutil>=5.9",
]

[project.optional-dependencies]
voice = [
    "piper-tts>=1.3,<2",
    "faster-whisper>=1.1,<2",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[project.scripts]
wednesday = "wednesday.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["wednesday*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "live: needs the real model runtime and weights (run with -m live)",
]
addopts = "-m 'not live'"
